name: test
on:
  push:
  pull_request:
jobs:
  test:
    name: go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.24 is the floor go.mod declares; stable is whatever is current. Both matter: the assembler's encoding
        # choices differ between releases -- VPBROADCASTB from a general register became an AVX-512 encoding, which
        # SIGILLed on a runner with only AVX2 -- and only the stable job caught it.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # Before the tests, not after: when a test fails the later steps are skipped, and this line is exactly what is
      # needed to read such a failure -- it says whether the machine took the AVX2 path or the SSE2 one.
      - name: which vector path this machine takes
        run: go test -count=1 -v -run 'AVX2DetectionIsVisible' .
      - name: vet
        run: go vet ./...
      - name: unit, scenario and example tests (race)
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: coverage
        run: go tool cover -func=cover.out | tail -1
      - name: build every example
        run: go build ./...
      - name: run every example with its sample input
        run: |
          for d in examples/*/; do
            [ -f "$d/main.go" ] || continue
            echo "== $d"
            go run "./$d" < /dev/null || [ "$(basename "$d")" = fallback ]
          done
      - name: wasip1 build
        run: GOOS=wasip1 GOARCH=wasm go build ./...
  arm64:
    name: arm64 (the architecture the benchmarks are taken on)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: vet
        run: go vet ./...
      - name: unit, scenario and example tests (race)
        run: go test -race -count=1 ./...
      - name: wasip1 build
        run: GOOS=wasip1 GOARCH=wasm go build ./...
      # What this runner turned out to have, in the log: the vector scan picks AVX2 or SSE2 at start from CPUID and
      # XGETBV, and "detected at start" is only a tested claim if the log says which branch ran.
      # A static guard for the mistake CI caught once: VPBROADCASTB from a general register is AVX-512BW, the
      # assembler encodes it with an EVEX prefix, and the detection only promises AVX2 -- so a machine with AVX2 and
      # no AVX-512 took SIGILL on the first instruction of the function. This finds such an encoding on any host,
      # including the arm64 developer machine that does not compile the file at all.
      - name: no AVX-512 encodings in the amd64 assembly
        run: sh hack/encoding-check.sh
      # Every architecture builds, and each selects the implementation it should: NEON on arm64, SSE2 on amd64,
      # the word-at-a-time loop everywhere else, and that same loop everywhere under -tags purego. Also all four
      # GOAMD64 levels, because the AVX2 choice is made at run time and must not depend on what the toolchain was
      # told to assume. This is the check that says the assembly stays an accelerator rather than a requirement.
      - name: every architecture builds and selects the right scan
        run: sh hack/portability-check.sh
      # arm64 has two implementations too: hand-written NEON by default, and the same scan through simd/archsimd
      # when the experiment is on. The second reaches VCMHI and VUMINV, which the assembler does not expose, so it
      # is a different instruction sequence and needs its own run.
      - name: the same scan through simd/archsimd
        run: GOEXPERIMENT=simd go test -race -count=1 .
      - name: and it still matches the reference byte for byte
        run: GOEXPERIMENT=simd go test -count=1 -v -run 'ScanStringBody|VectorScan' .
  simd:
    name: amd64 through simd/archsimd (GOEXPERIMENT=simd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      # The amd64 scan has two implementations: hand-written SSE2/AVX2 by default, and one written once through
      # simd/archsimd when the experiment is on. The second is the one this machine cannot execute -- the developer
      # machine is arm64 -- so it is held to the same reference implementation and contract tests here.
      - name: vet
        run: GOEXPERIMENT=simd go vet ./...
      - name: unit, scenario and example tests (race)
        run: GOEXPERIMENT=simd go test -race -count=1 ./...
      - name: the scan still matches its reference byte for byte
        run: GOEXPERIMENT=simd go test -count=1 -v -run 'ScanStringBody|VectorScan' .

  wasm:
    name: wasm through simd/archsimd, executed under node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Until Go 1.27 the wasm target emitted no vector instructions at all, so this scan did not exist here. It
      # does now, and this is the shape a gateway plugin runs, which makes executing it worth more than compiling
      # it: js/wasm runs under node through the wrapper Go ships, where wasip1 would need a wasi runtime.
      - name: the scan matches its reference under wasm, with vectors
        run: GOEXPERIMENT=simd GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -v -run 'ScanStringBody|VectorScan' .
      - name: and without the experiment, where it falls back to the word-at-a-time scan
        run: GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -run 'ScanStringBody' .
      - name: the target a gateway actually builds still builds, both ways
        run: |
          GOEXPERIMENT=simd GOOS=wasip1 GOARCH=wasm go build ./...
          GOOS=wasip1 GOARCH=wasm go build ./...

  bench:
    name: benchmarks compile and run once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      # One iteration each: this guards against a benchmark that no longer builds or panics, which is how a
      # measurement harness rots. The numbers from a shared runner are not comparable, so none are recorded.
      - run: go test -run='^$' -bench=. -benchtime=1x ./...

  fuzz:
    name: native fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go test -run='^$' -fuzz=FuzzPassthrough -fuzztime=30s .
      - run: go test -run='^$' -fuzz=FuzzKeyProbe -fuzztime=20s .
