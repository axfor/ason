name: test
on:
  push:
  pull_request:
jobs:
  test:
    name: go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: unit, scenario and example tests (race)
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: coverage
        run: go tool cover -func=cover.out | tail -1
      - name: build every example
        run: go build ./...
      - name: run every example with its sample input
        run: |
          for d in examples/*/; do
            [ -f "$d/main.go" ] || continue
            echo "== $d"
            go run "./$d" < /dev/null || [ "$(basename "$d")" = fallback ]
          done
      - name: wasip1 build
        run: GOOS=wasip1 GOARCH=wasm go build ./...
  arm64:
    name: arm64 (the architecture the benchmarks are taken on)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: vet
        run: go vet ./...
      - name: unit, scenario and example tests (race)
        run: go test -race -count=1 ./...
      - name: wasip1 build
        run: GOOS=wasip1 GOARCH=wasm go build ./...
      # What this runner turned out to have, in the log: the vector scan picks AVX2 or SSE2 at start from CPUID and
      # XGETBV, and "detected at start" is only a tested claim if the log says which branch ran.
      - name: which vector path this machine takes
        run: go test -count=1 -v -run 'AVX2' .

  bench:
    name: benchmarks compile and run once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      # One iteration each: this guards against a benchmark that no longer builds or panics, which is how a
      # measurement harness rots. The numbers from a shared runner are not comparable, so none are recorded.
      - run: go test -run='^$' -bench=. -benchtime=1x ./...

  fuzz:
    name: native fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go test -run='^$' -fuzz=FuzzPassthrough -fuzztime=30s .
      - run: go test -run='^$' -fuzz=FuzzKeyProbe -fuzztime=20s .
